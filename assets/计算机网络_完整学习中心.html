<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>计算机网络 · 完整学习中心</title></head><body><script>(()=>{const pages={"home":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>计算机网络 · 算法与计算题通关手册（第 1—6 章）\u003c/title>\n\u003cstyle>\n:root{\n  --bg:#f5f7fa; --card:#fff; --line:#e2e7ee; --ink:#1e2530; --sub:#5d6776;\n  --blue:#2f6fdb; --blue-bg:#eef4ff; --green:#15803d; --green-bg:#ecf8f0;\n  --orange:#bd5f0a; --orange-bg:#fff4e6; --purple:#6846bd; --purple-bg:#f3efff;\n  --mono:\"SFMono-Regular\",Consolas,\"Liberation Mono\",\"Courier New\",monospace;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 -apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\na{color:var(--blue);text-decoration:none}\ncode{font-family:var(--mono);background:#eef1f5;border:1px solid #e0e5ec;border-radius:4px;padding:1px 5px;font-size:.9em;color:#243b6b}\n.app{display:grid;grid-template-columns:252px minmax(0,1fr);max-width:1320px;margin:0 auto;gap:0}\n\n/* ---------- 侧栏 ---------- */\naside{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:22px 16px 40px}\naside .brand{font-size:15px;font-weight:700;letter-spacing:.3px;margin-bottom:4px}\naside .brand small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:3px}\n.prog{background:var(--blue-bg);border-radius:8px;padding:10px 12px;margin:16px 0 14px;font-size:12.5px;color:#274a8c}\n.prog b{font-size:17px}\n.progbar{height:5px;background:#d5e2fb;border-radius:5px;margin-top:8px;overflow:hidden}\n.progbar i{display:block;height:100%;width:0;background:var(--blue);border-radius:5px;transition:width .25s}\naside .grp{margin:14px 0 4px;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.5px;padding-left:6px}\naside a.toc{display:block;font-size:12.8px;line-height:1.5;color:#3b4657;padding:5px 8px;border-radius:6px;border-left:2px solid transparent}\naside a.toc:hover{background:var(--blue-bg);color:var(--blue)}\naside a.toc .num{font-family:var(--mono);color:#9aa4b2;font-size:11px;margin-right:6px}\naside .tip{margin-top:22px;font-size:11.5px;color:var(--sub);line-height:1.7;border-top:1px dashed var(--line);padding-top:14px}\n\n/* ---------- 主体 ---------- */\nmain{padding:0 34px 90px;min-width:0}\n.hero{padding:34px 0 20px}\n.hero h1{margin:0 0 8px;font-size:27px;letter-spacing:.4px}\n.hero p{margin:0;color:var(--sub);font-size:14px;max-width:820px}\n.hero .meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}\n.pill{background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:12px;color:var(--sub)}\n.toolbar{position:sticky;top:0;z-index:20;background:rgba(245,247,250,.96);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}\n.toolbar input[type=search]{flex:1;min-width:170px;border:1px solid var(--line);border-radius:7px;padding:7px 11px;font-size:13px;background:#fff;color:var(--ink);outline:none}\n.toolbar input[type=search]:focus{border-color:var(--blue)}\nbutton{cursor:pointer;font-family:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;color:#3b4657;border-radius:7px;padding:7px 11px;transition:.15s}\nbutton:hover{border-color:var(--blue);color:var(--blue)}\nbutton.pri{background:var(--blue);border-color:var(--blue);color:#fff}\nbutton.pri:hover{background:#255cbd;color:#fff}\n.lab{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--sub);cursor:pointer;white-space:nowrap}\n#hit{font-size:12px;color:var(--sub);min-width:70px}\n\nh2.chap{font-size:20px;margin:38px 0 4px;padding-bottom:9px;border-bottom:2px solid var(--blue);scroll-margin-top:70px}\n.chapintro{color:var(--sub);font-size:13.5px;margin:0 0 18px}\nh2.sec{font-size:19px;margin:40px 0 12px;scroll-margin-top:70px}\n\n/* ---------- 卡片 ---------- */\n.card{background:var(--card);border:1px solid var(--line);border-radius:11px;margin:0 0 16px;padding:18px 20px 16px;scroll-margin-top:70px;box-shadow:0 1px 2px rgba(20,35,60,.03)}\n.card.hide{display:none}\n.chd{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}\n.chd .no{font-family:var(--mono);font-size:12px;color:#8b95a3;background:#f2f4f8;border-radius:5px;padding:2px 7px;margin-top:3px}\n.chd h3{margin:0;font-size:16.5px;flex:1;min-width:190px;line-height:1.5}\n.tag{font-size:11px;border-radius:5px;padding:2px 8px;white-space:nowrap;margin-top:3px;font-weight:600}\n.tag.calc{background:var(--blue-bg);color:var(--blue)}\n.tag.algo{background:var(--purple-bg);color:var(--purple)}\n.tag.sup{background:#eff2f6;color:#5d6776}\n.tag.hot{background:var(--orange-bg);color:var(--orange)}\n.done{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--sub);cursor:pointer;white-space:nowrap;margin-top:4px}\n.done input{accent-color:var(--green)}\n.card.mastered{border-color:#bfe3c9}\n.row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;margin:10px 0;font-size:14px}\n.lb{font-size:12px;color:var(--sub);font-weight:700;padding-top:3px;letter-spacing:.3px}\n.row ol,.row ul{margin:0;padding-left:20px}\n.row li{margin:2px 0}\n.fx{background:var(--blue-bg);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0;font-family:var(--mono);font-size:14px;line-height:2;color:#20447e;overflow-x:auto}\n.fx div{white-space:nowrap}\n.ex{background:#fafbfd;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0 10px}\n.ex .q{font-size:14px;margin:4px 0 10px}\n.ex .q b{color:#243b6b}\n.sol{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:11px}\n.sol.open{display:block}\n.sol ol{margin:0 0 10px;padding-left:20px;font-size:13.5px}\n.sol li{margin:4px 0}\n.ans{background:var(--green-bg);border-left:3px solid var(--green);border-radius:0 7px 7px 0;padding:8px 12px;font-size:14px;color:#14562f;font-weight:600}\n.trap{background:var(--orange-bg);border-left:3px solid var(--orange);border-radius:0 7px 7px 0;padding:8px 12px;font-size:13px;color:#7a440c;margin-top:10px}\n.source{color:#9aa4b2;font-size:11.5px;margin-top:9px}\n\n/* 速查表 */\ntable{border-collapse:collapse;width:100%;background:#fff;font-size:13px;margin:10px 0 18px}\nth,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\nth{background:#eff3f9;color:#33425a;font-weight:600}\ntd:first-child{white-space:nowrap;color:#5d6776;font-family:var(--mono);font-size:12px}\ntd:nth-child(2){font-weight:600}\ntd:nth-child(3){font-family:var(--mono);font-size:12.5px;color:#20447e}\n.note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px;font-size:13.5px;margin:14px 0}\n.note h3{margin:0 0 8px;font-size:15px}\n.note ul{margin:0;padding-left:20px}\nfooter{color:var(--sub);font-size:12px;text-align:center;padding:26px 0 0;border-top:1px solid var(--line);margin-top:40px}\n.empty{display:none;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--sub);font-size:14px}\n\n@media(max-width:900px){\n  .app{grid-template-columns:1fr}\n  aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:16px}\n  aside .tocwrap{max-height:190px;overflow-y:auto}\n  main{padding:0 16px 60px}\n  .row{grid-template-columns:1fr;gap:3px}\n}\n@media print{\n  body{background:#fff}\n  aside,.toolbar,.ex>button,.done,.hero .meta{display:none!important}\n  .app{grid-template-columns:1fr}\n  main{padding:0}\n  .card{break-inside:avoid;box-shadow:none;border-color:#ccc;page-break-inside:avoid}\n  .sol{display:block!important}\n  h2.chap{break-after:avoid}\n  .fx,.ex,.trap,.ans{print-color-adjust:exact;-webkit-print-color-adjust:exact}\n}\n.desk{padding:18px 0;border-block:1px solid #b7c8ce;margin-bottom:24px}.desk h2{font-size:21px;margin:8px 0}.desk p{margin:8px 0}.desk small{color:#49625e}.desk select,.desk input,.desk textarea{font:inherit;color:inherit;border:1px solid #acbbc5;border-radius:5px;padding:6px;background:white;max-width:100%}.desk textarea{width:100%}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}.desk .pri{background:#11685c;border-color:#11685c}.muted{color:#566572;font-size:13px}.feedback{border-left:3px solid #ab560e;padding-left:12px}.lesson{background:#edf4f3;padding:12px 16px;border-left:3px solid #297566}.desk details{margin:12px 0}.desk summary{cursor:pointer;color:#245975}.meter{height:12px;max-width:440px;display:flex;background:#dde6eb}.meter i:first-child{background:#167769}.meter i:last-child{background:#5584be}.desk .qtext{font-size:17px;font-weight:600}#quickwrap{overflow-x:auto}.desk :focus-visible{outline:2px solid #2362a7;outline-offset:2px}@media(max-width:900px){aside .tip{display:none}aside .tocwrap{max-height:80px}.toolbar{position:static}.hero{padding-top:18px}}@media print{.desk,.trainlink{display:none!important}}\n.hub{padding:32px 0 26px}.hub h1{margin:3px 0 0;font-size:29px;line-height:1.4}.hub p{margin:5px 0 20px;color:#536073}.hubgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{display:grid;grid-template-rows:34px auto auto auto;gap:4px;justify-items:start;text-align:left;padding:18px;color:white;background:var(--tone);border:0;border-radius:10px}.tile:hover,.tile:focus-visible{color:white;background:var(--tone);box-shadow:inset 0 0 0 3px var(--accent)}.tile svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tile b{font-size:18px}.tile span{color:#fff;font-size:13px}.tile small{color:var(--accent);font-weight:600;margin-top:6px}.hubnav{margin:16px 0 10px}.hubnav button,.pathnode{color:#165c55;font-weight:600}.pathline{margin:10px 0;padding:10px 0;border-bottom:1px solid var(--line)}.evidence{display:flex;flex-wrap:wrap;gap:18px;margin:15px 0}.evidence b{display:block;font:700 23px/1.2 var(--mono);color:#21544c}.evidence span{color:#43566a;font-size:13px}#desk[hidden],#hub[hidden],#coachControls[hidden],#backHub[hidden]{display:none}.hero{padding:12px 0}.hero h1{font-size:20px}@media(max-width:900px){.hub{padding-top:18px}.hubgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:14px}.app>aside{display:none}.hub h1{font-size:25px}}@media print{.hub,.hubnav{display:none!important}}\n\u003c/style>\n\u003clink rel=\"stylesheet\" href=\"exam.css\">\u003clink rel=\"stylesheet\" href=\"account.css\">\u003cscript src=\"account.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n\u003caside>\n  \u003cdiv class=\"brand\">算法与计算题手册\u003csmall>计算机网络 · 六章原创练习\u003c/small>\u003c/div>\n  \u003ca class=\"toc\" href=\"#desk\">进入分步训练 ↓\u003c/a>\u003cdiv class=\"prog\">自评掌握 \u003cb id=\"pcount\">0\u003c/b> / \u003cspan id=\"ptotal\">0\u003c/span> 条\n    \u003cdiv class=\"progbar\">\u003ci id=\"pbar\">\u003c/i>\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"toc\" class=\"tocwrap\">\u003c/div>\n  \u003cdiv class=\"tip\">用法：\u003cb>先自己算\u003c/b>，再点开逐步解答对答案；算对的勾「已掌握」，进度会自动保存。顶部搜索框可输「分片」「掩码」「RTT」直接跳题。打印时所有解答会自动展开。\u003c/div>\n\u003c/aside>\n\n\u003cmain>\n  \u003csection class=\"hub\" id=\"hub\">\u003csmall>计算机网络 · 备考手册\u003c/small>\u003ch1 tabindex=\"-1\" id=\"hubTitle\">AI 智能学习中心\u003c/h1>\u003cp>选择功能，开始学习\u003c/p>\u003cdiv class=\"hubgrid\" id=\"hubGrid\">\u003c/div>\u003c/section>\n  \u003cdiv class=\"hubnav\">\u003cbutton id=\"backHub\" hidden>← 学习中心\u003c/button>\u003c/div>\n  \u003csection id=\"desk\" class=\"desk\" hidden aria-label=\"学习模块\">\u003csmall id=\"sectionName\">\u003c/small>\u003cdiv class=\"controls\" id=\"coachControls\">\u003clabel>专项 \u003cselect id=\"track\">\u003c/select>\u003c/label>\u003cbutton id=\"start\">开始诊断\u003c/button>\u003cbutton id=\"plan\">我的复习计划\u003c/button>\u003c/div>\u003cdiv id=\"stage\" aria-live=\"polite\" tabindex=\"-1\">\u003c/div>\u003csmall id=\"storageNote\" role=\"status\">\u003c/small>\u003c/section>\n  \u003cdiv class=\"hero\">\n    \u003ch1>计算机网络 · 分步备考手册\u003c/h1>\n    \u003cp>算法与计算题　/　从识别题型，到独立写出卷面答案\u003c/p>\n    \u003cdiv class=\"meta\">\n      \u003cspan class=\"pill\" id=\"pillTotal\">共 0 条\u003c/span>\n      \u003cspan class=\"pill\">六章全覆盖\u003c/span>\n      \u003cspan class=\"pill\">含单位和边界检查\u003c/span>\n      \u003cspan class=\"pill\">可打印 / 存 PDF\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"toolbar\">\n    \u003cinput type=\"search\" id=\"q\" placeholder=\"搜索：分片 / 掩码 / CRC / 利用率 / RTO / RTT …\">\n    \u003cspan id=\"hit\">\u003c/span>\n    \u003clabel class=\"lab\">\u003cinput type=\"checkbox\" id=\"onlyLeft\"> 只看未掌握\u003c/label>\n    \u003cbutton id=\"expand\">展开全部解答\u003c/button>\n    \u003cbutton id=\"collapse\">收起全部解答\u003c/button>\n    \u003cbutton id=\"reset\">清空掌握记录\u003c/button>\n    \u003cbutton class=\"pri\" onclick=\"window.print()\">打印 / 存 PDF\u003c/button>\n  \u003c/div>\n\n  \u003cdiv id=\"content\">\u003c/div>\n  \u003cdiv class=\"empty\" id=\"empty\">没有匹配的条目，换个关键词试试。\u003c/div>\n\n  \u003cfooter>Adaptive Study Center · MIT · 原创教学示例\u003c/footer>\n\u003c/main>\n\u003c/div>\n\n\u003cscript>\nconst CHAPS=[{\"n\":1,\"t\":\"第 1 章 · 串行发送\",\"sub\":\"串行发送\",\"intro\":\"发送耗时等于比特数除以链路比特率。\"},{\"n\":2,\"t\":\"第 2 章 · 多级信号\",\"sub\":\"多级信号\",\"intro\":\"理想无噪声模型下，每个有 M 种状态的码元可表示 log₂(M) bit。\"},{\"n\":3,\"t\":\"第 3 章 · 比特填充\",\"sub\":\"比特填充\",\"intro\":\"在数据部分连续五个 1 后插入一个 0。\"},{\"n\":4,\"t\":\"第 4 章 · 子网容量\",\"sub\":\"子网容量\",\"intro\":\"普通 IPv4 广播子网可用地址数为 2 的主机位数次方减二。\"},{\"n\":5,\"t\":\"第 5 章 · 累计确认\",\"sub\":\"累计确认\",\"intro\":\"按序接收时，确认号表示下一期望字节的序号。\"},{\"n\":6,\"t\":\"第 6 章 · 往返等待\",\"sub\":\"往返等待\",\"intro\":\"理想化模型：新建 TCP 获取单个极小文档，忽略其他开销，需要两次往返。\"}];\nconst D=[{\"n\":2,\"ch\":1,\"t\":\"串行发送\",\"tag\":\"calc\",\"when\":\"发送耗时等于比特数除以链路比特率。\",\"f\":[\"发送耗时等于比特数除以链路比特率。\"],\"steps\":[\"先把字节数乘 8\",\"再除以比特率。\"],\"ex\":\"625 B 经过 1 Mbit/s 发送器需要多少毫秒？\",\"sol\":[\"先把字节数乘 8；再除以比特率。\",\"5 ms\"],\"ans\":\"5 ms\",\"trap\":\"不要把发送时延和链路传播时间混在一起。\",\"src\":\"公开示例 · 第 1 章\"},{\"n\":8,\"ch\":2,\"t\":\"多级信号\",\"tag\":\"calc\",\"when\":\"理想无噪声模型下，每个有 M 种状态的码元可表示 log₂(M) bit。\",\"f\":[\"理想无噪声模型下，每个有 M 种状态的码元可表示 log₂(M) bit。\"],\"steps\":[\"先求每码元信息量\",\"再乘每秒码元数。\"],\"ex\":\"每秒发送 625 个四状态码元，可表示多少 bit/s？\",\"sol\":[\"先求每码元信息量；再乘每秒码元数。\",\"1250 bit/s\"],\"ans\":\"1250 bit/s\",\"trap\":\"码元每秒不总等于比特每秒。\",\"src\":\"公开示例 · 第 2 章\"},{\"n\":17,\"ch\":3,\"t\":\"比特填充\",\"tag\":\"calc\",\"when\":\"在数据部分连续五个 1 后插入一个 0。\",\"f\":[\"在数据部分连续五个 1 后插入一个 0。\"],\"steps\":[\"用 0 分隔各段\",\"逐段数原始连续 1 的长度。\"],\"ex\":\"若数据正好由 5 组 111110 拼成，按五个 1 后插 0 的规则会新增多少位？\",\"sol\":[\"用 0 分隔各段；逐段数原始连续 1 的长度。\",\"5 位\"],\"ans\":\"5 位\",\"trap\":\"插入的 0 不属于原数据。\",\"src\":\"公开示例 · 第 3 章\"},{\"n\":27,\"ch\":4,\"t\":\"子网容量\",\"tag\":\"calc\",\"when\":\"普通 IPv4 广播子网可用地址数为 2 的主机位数次方减二。\",\"f\":[\"普通 IPv4 广播子网可用地址数为 2 的主机位数次方减二。\"],\"steps\":[\"从 32 减去前缀长度\",\"保留网络地址和广播地址。\"],\"ex\":\"普通 /24 广播子网可用多少个主机地址？\",\"sol\":[\"从 32 减去前缀长度；保留网络地址和广播地址。\",\"254 个\"],\"ans\":\"254 个\",\"trap\":\"此题是传统广播子网，不推广到 /31 或 /32。\",\"src\":\"公开示例 · 第 4 章\"},{\"n\":41,\"ch\":5,\"t\":\"累计确认\",\"tag\":\"calc\",\"when\":\"按序接收时，确认号表示下一期望字节的序号。\",\"f\":[\"按序接收时，确认号表示下一期望字节的序号。\"],\"steps\":[\"找到首字节序号\",\"加上数据段字节数。\"],\"ex\":\"起始序号 900，按序收到 125 B 数据，不计 SYN 和 FIN。下一确认号是多少？\",\"sol\":[\"找到首字节序号；加上数据段字节数。\",\"1025\"],\"ans\":\"1025\",\"trap\":\"不要把确认号写成最后一个已收到的序号。\",\"src\":\"公开示例 · 第 5 章\"},{\"n\":51,\"ch\":6,\"t\":\"往返等待\",\"tag\":\"calc\",\"when\":\"理想化模型：新建 TCP 获取单个极小文档，忽略其他开销，需要两次往返。\",\"f\":[\"理想化模型：新建 TCP 获取单个极小文档，忽略其他开销，需要两次往返。\"],\"steps\":[\"列出建立连接和请求响应\",\"合计两个 RTT。\"],\"ex\":\"无缓存、新建 TCP、明文 HTTP 请求一个极小文档。仅计两次往返，RTT 为 35 ms，总等待为多少毫秒？\",\"sol\":[\"列出建立连接和请求响应；合计两个 RTT。\",\"70 ms\"],\"ans\":\"70 ms\",\"trap\":\"该模型不含 DNS、TLS、处理和正文传输时间。\",\"src\":\"公开示例 · 第 6 章\"}];\nconst KEY='cn_alg_mastered_v1';\nlet mastered=[];\ntry{ mastered=JSON.parse(studyStore.getItem(KEY)||'[]'); }catch(e){ mastered=[]; }\nif(!Array.isArray(mastered)) mastered=[];\n\nconst TAG={\n  calc:['必考计算','calc'],\n  algo:['算法流程','algo'],\n  sup:['教材补充','sup'],\n  hot:['易错重点','hot']\n};\nfunction esc(s){return String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');}\nfunction fmt(s){return esc(s).replace(/\\[\\[(.+?)\\]\\]/g,'\u003ccode>$1\u003c/code>').replace(/\\*\\*(.+?)\\*\\*/g,'\u003cstrong>$1\u003c/strong>');}\nfunction pad(n){return n\u003c10?'0'+n:''+n;}\nfunction save(){try{studyStore.setItem(KEY,JSON.stringify(mastered));}catch(e){}}\n\nfunction quickHTML(){\n  let h='\u003csection id=\"quickwrap\">\u003ch2 class=\"sec\" id=\"quick\">一页纸公式速查\u003c/h2>';\n  h+='\u003cp class=\"chapintro\">考前只看这张表也能把公式捡回来。点目录里的条目可跳到完整步骤和例题。\u003c/p>';\n  CHAPS.forEach(function(c){\n    h+='\u003cdiv style=\"font-size:14px;font-weight:700;margin:18px 0 6px;color:#33425a\">'+esc(c.t)+'　\u003cspan style=\"font-weight:400;color:#8b95a3;font-size:12px\">'+esc(c.sub)+'\u003c/span>\u003c/div>';\n    h+='\u003ctable>\u003cthead>\u003ctr>\u003cth>编号\u003c/th>\u003cth>题型\u003c/th>\u003cth>公式 / 规则\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n    D.filter(function(d){return d.ch===c.n;}).forEach(function(d){\n      h+='\u003ctr>\u003ctd>'+pad(d.n)+'\u003c/td>\u003ctd>'+fmt(d.t)+'\u003c/td>\u003ctd>'+d.f.map(fmt).join('\u003cbr>')+'\u003c/td>\u003c/tr>';\n    });\n    h+='\u003c/tbody>\u003c/table>';\n  });\n  h+='\u003c/section>';\n  return h;\n}\n\nfunction cardHTML(d){\n  const tg=TAG[d.tag]||TAG.calc;\n  let h='\u003carticle class=\"card\" id=\"a'+d.n+'\" data-n=\"'+d.n+'\" data-ch=\"'+d.ch+'\">';\n  h+='\u003cdiv class=\"chd\">\u003cspan class=\"no\">'+pad(d.n)+'\u003c/span>\u003ch3>'+fmt(d.t)+'\u003c/h3>';\n  h+='\u003cspan class=\"tag '+tg[1]+'\">'+tg[0]+'\u003c/span>';\n  h+='\u003clabel class=\"done\">\u003cinput type=\"checkbox\" data-mark=\"'+d.n+'\"> 已掌握\u003c/label>\u003c/div>';\n  h+='\u003cdiv class=\"row\">\u003cspan class=\"lb\">什么时候用\u003c/span>\u003cdiv>'+fmt(d.when)+'\u003c/div>\u003c/div>';\n  h+='\u003cdiv class=\"fx\">'+d.f.map(fmt).map(function(x){return '\u003cdiv>'+x+'\u003c/div>';}).join('')+'\u003c/div>';\n  h+='\u003cdiv class=\"row\">\u003cspan class=\"lb\">怎么做\u003c/span>\u003col>'+d.steps.map(function(x){return '\u003cli>'+fmt(x)+'\u003c/li>';}).join('')+'\u003c/ol>\u003c/div>';\n  h+='\u003cdiv class=\"ex\">\u003cspan class=\"lb\">例题 · 先自己算\u003c/span>\u003cp class=\"q\">'+fmt(d.ex)+'\u003c/p>';\n  h+='\u003cbutton class=\"trainlink pri\" data-practice=\"'+d.n+'\">原题分步练习\u003c/button> \u003cbutton data-act=\"sol\" data-n=\"'+d.n+'\">看逐步解答\u003c/button>';\n  h+='\u003cdiv class=\"sol\" id=\"s'+d.n+'\">\u003cspan class=\"lb\">逐步解答\u003c/span>\u003col>'+d.sol.map(function(x){return '\u003cli>'+fmt(x)+'\u003c/li>';}).join('')+'\u003c/ol>';\n  h+='\u003cdiv class=\"ans\">答案：'+fmt(d.ans)+'\u003c/div>\u003c/div>\u003c/div>';\n  h+='\u003cdiv class=\"trap\">\u003cb>最容易错：\u003c/b>'+fmt(d.trap)+'\u003c/div>';\n  h+='\u003cdiv class=\"source\">出处：'+fmt(d.src||'—')+'\u003c/div>';\n  h+='\u003c/article>';\n  return h;\n}\n\nlet html=quickHTML();\nCHAPS.forEach(function(c){\n  html+='\u003ch2 class=\"chap\" id=\"ch'+c.n+'\">'+esc(c.t)+'\u003c/h2>';\n  html+='\u003cp class=\"chapintro\" data-intro=\"'+c.n+'\">'+esc(c.intro)+'\u003c/p>';\n  D.filter(function(d){return d.ch===c.n;}).forEach(function(d){ html+=cardHTML(d); });\n});\ndocument.getElementById('content').innerHTML=html;\n\n/* 目录 */\nlet toc='\u003cdiv class=\"grp\">\u003ca class=\"toc\" href=\"#quick\">★　一页纸公式速查\u003c/a>\u003c/div>';\nCHAPS.forEach(function(c){\n  toc+='\u003cdiv class=\"grp\">'+esc(c.t)+'\u003c/div>';\n  D.filter(function(d){return d.ch===c.n;}).forEach(function(d){\n    toc+='\u003ca class=\"toc\" href=\"#a'+d.n+'\">\u003cspan class=\"num\">'+pad(d.n)+'\u003c/span>'+esc(d.t)+'\u003c/a>';\n  });\n});\ndocument.getElementById('toc').innerHTML=toc;\ndocument.getElementById('ptotal').textContent=D.length;\ndocument.getElementById('pillTotal').textContent='共 '+D.length+' 条 · 六章全覆盖';\n\n/* 搜索索引 */\ndocument.querySelectorAll('.card').forEach(function(c){ c.dataset.s=c.textContent.toLowerCase(); });\nfunction markChecked(){\n  document.querySelectorAll('.card').forEach(function(c){\n    const n=+c.dataset.n;\n    const cb=c.querySelector('[data-mark]');\n    if(cb) cb.checked=mastered.indexOf(n)>=0;\n    c.classList.toggle('mastered',mastered.indexOf(n)>=0);\n  });\n}\nfunction updateProg(){\n  document.getElementById('pcount').textContent=mastered.length;\n  document.getElementById('pbar').style.width=(100*mastered.length/D.length)+'%';\n}\nfunction applyFilter(){\n  const q=document.getElementById('q').value.trim().toLowerCase();\n  const only=document.getElementById('onlyLeft').checked;\n  let vis=0;\n  document.querySelectorAll('.card').forEach(function(c){\n    const n=+c.dataset.n;\n    const okQ=(!q)||c.dataset.s.indexOf(q)>=0;\n    const okM=(!only)||mastered.indexOf(n)\u003c0;\n    const show=okQ&&okM;\n    c.classList.toggle('hide',!show);\n    if(show) vis++;\n  });\n  CHAPS.forEach(function(c){\n    const h=document.getElementById('ch'+c.n);\n    const intro=document.querySelector('[data-intro=\"'+c.n+'\"]');\n    let any=false;\n    document.querySelectorAll('.card[data-ch=\"'+c.n+'\"]').forEach(function(x){ if(!x.classList.contains('hide')) any=true; });\n    h.style.display=any?'':'none';\n    intro.style.display=any?'':'none';\n  });\n  document.getElementById('quickwrap').style.display=q?'none':'';\n  document.getElementById('empty').style.display=(vis===0)?'block':'none';\n  document.getElementById('hit').textContent=q?('命中 '+vis+' 条'):(only?('还剩 '+vis+' 条'):'');\n}\n\ndocument.getElementById('content').addEventListener('click',function(e){\n  const b=e.target.closest('[data-act=\"sol\"]');\n  if(!b) return;\n  const box=document.getElementById('s'+b.dataset.n);\n  const open=box.classList.toggle('open');\n  b.textContent=open?'收起解答':'看逐步解答';\n});\ndocument.getElementById('content').addEventListener('change',function(e){\n  const cb=e.target.closest('[data-mark]');\n  if(!cb) return;\n  const n=+cb.dataset.mark;\n  const i=mastered.indexOf(n);\n  if(cb.checked && i\u003c0) mastered.push(n);\n  if(!cb.checked && i>=0) mastered.splice(i,1);\n  cb.closest('.card').classList.toggle('mastered',cb.checked);\n  save(); updateProg();\n  if(document.getElementById('onlyLeft').checked) applyFilter();\n});\nfunction setAll(open){\n  document.querySelectorAll('.sol').forEach(function(s){ s.classList.toggle('open',open); });\n  document.querySelectorAll('[data-act=\"sol\"]').forEach(function(b){ b.textContent=open?'收起解答':'看逐步解答'; });\n}\ndocument.getElementById('expand').addEventListener('click',function(){setAll(true);});\ndocument.getElementById('collapse').addEventListener('click',function(){setAll(false);});\ndocument.getElementById('reset').addEventListener('click',function(){\n  mastered=[]; save(); markChecked(); updateProg(); applyFilter();\n  const b=this, old=b.textContent; b.textContent='已清空';\n  setTimeout(function(){b.textContent=old;},1200);\n});\ndocument.getElementById('q').addEventListener('input',applyFilter);\ndocument.getElementById('onlyLeft').addEventListener('change',applyFilter);\n\nmarkChecked(); updateProg(); applyFilter();\n\u003c/script>\n\u003cscript src=\"exam-data.js\">\u003c/script>\u003cscript src=\"course-docs.js\">\u003c/script>\u003cscript src=\"exam-common.js\">\u003c/script>\u003cscript src=\"learning-centers.js\">\u003c/script>\n\u003cscript>\n(() => {\n'use strict';\nconst $=id=>document.getElementById(id), stage=$('stage');\nconst bank=new Map(D.map(d=>[d.n,d]));\nconst q=(text,unit,value,work,wrong={})=>({text,unit,value,work,wrong});\n// 每个专项有一道前测、一组分解题和一道改变条件的独立题。\nconst tracks={\n2:{name:'发送与传播',plain:'想象一列车通过闸门：整列车离开闸门，对应发送完毕；最后一节车厢还要走到终点，对应传播。',rule:'发送时延 L/R，传播时延 d/v。把两项换成同一时间单位，再加处理与排队。',edge:'只换网卡，不换光纤：受影响的是把比特推上链路的时间，不是信号在介质中的速度。',\n pre:q('同一条光纤，单向传播原需 10 ms。只把发送速率翻倍，传播时延是多少？','ms',10,'距离和介质不变，d/v 仍是 10 ms。',{5:'把发送速率误当成了信号传播速度。'}),\n steps:[q('1500 B 的分组有多少比特？','bit',12000,'1500 × 8 = 12000 bit。',{1500:'B 是字节，不是 bit；1 B = 8 bit。'}),q('把这 12000 bit 推入 100 Mbit/s 的链路，需多少毫秒？','ms',0.12,'12000 ÷ 10⁸ s × 1000 = 0.12 ms。',{'0.00012':'算出的是秒，还没有换成毫秒。'}),q('2000 km 的链路，传播速度 2×10⁸ m/s。仅传播需多久？','ms',10,'2×10⁶ ÷ (2×10⁸) × 1000 = 10 ms。'),q('发送 0.12 ms，传播 10 ms，处理与排队合计 2 ms。总时延呢？','ms',12.12,'0.12 + 10 + 2 = 12.12 ms。')],\n test:k=>q(`单链路传送 ${1250*k} B，速率 100 Mbit/s，传播 8 ms，处理与排队合计 1 ms。只把发送速率翻倍后，总时延是多少？`,'ms',9+k/20,`发送 = ${1250*k} × 8 ÷ (200×10⁶) × 1000 = ${k/20} ms；再加 8 + 1 ms。`)},\n8:{name:'码元与数据率',plain:'一次举牌可以从 8 张牌里选一张。描述选的是哪一张，需要 3 个二进制位。',rule:'M 种可区分状态，每码元携带 log₂M bit（M 为 2 的整数次幂）；数据率 = 波特率 × 每码元比特数。',edge:'提高码元速率和增加每码元状态数是两种不同操作。状态数翻倍，每码元只多携带 1 bit。',\n pre:q('理想编码使用 8 种状态，一个码元携带几比特？','bit',3,'2³ = 8，所以是 3 bit。',{8:'状态数不是比特数。'}),steps:[q('16 种状态要用几比特编号？','bit',4,'2⁴ = 16。'),q('每秒 2000 个码元，每码元 4 bit，每秒多少 bit？','bit/s',8000,'2000 × 4 = 8000 bit/s。')],test:k=>q(`速率为 ${4*k} kbit/s，采用 16 种状态的理想编码。所需的码元速率是多少？`,'Baud',k*1000,`${4*k} × 1000 ÷ 4 = ${k*1000} Baud。`)},\n17:{name:'零比特填充',plain:'给数据加上路标：发送方每发出连续五个 1 就插一个 0，接收方按相同规则去掉它。',rule:'只扫描帧的数据区。遇 0 计数清零；连续五个 1 后插 0，再从零计数。',edge:'末尾即使没有下一个数据位，已经凑满五个 1 也要填充。不能用整串 1 的总数除以五。',\n pre:q('原数据 111011 中有五个 1，要插几个 0？','个',0,'中间的 0 打断计数，最长只有三个连续的 1。',{1:'你数的是总数，不是连续个数。'}),steps:[q('原数据 11111 发送时插几个 0？','个',1,'满五个 1，立即插入一个 0。'),q('原数据 11111011111 填充后总长多少位？','bit',13,'11 个原始位，两段各插 1 位，共 13 位。')],test:k=>q(`数据是 ${k} 组 111110，后面再接 1111；不计帧定界符。填充后总长度是多少？`,'bit',7*k+4,`原长 6×${k}+4，每组插一位，末尾四个 1 不插，共 ${7*k+4} 位。`)},\n27:{name:'主机数与前缀',plain:'子网像一排门牌。传统 IPv4 广播子网里，首尾两个号码留作网络地址和广播地址。',rule:'找最小的 h，使 2ʰ−2 ≥ 可用主机需求；前缀长度 = 32−h。',edge:'问地址总数与问可用主机数不同。这里讨论普通广播子网，不套用到 /31 点到点链路。',\n pre:q('普通 IPv4 广播子网共有 64 个地址，可分给主机几个？','个',62,'64 − 2 = 62。',{64:'没有留出网络地址和广播地址。'}),steps:[q('要容纳 63 台主机，加上保留地址至少需要几个地址？','个',65,'63 + 2 = 65。'),q('最小能容纳 65 个地址的块有几个主机位？','位',7,'2⁶ = 64 不够，2⁷ = 128。'),q('IPv4 地址中有 7 个主机位，前缀长度是多少？','位',25,'32 − 7 = 25，写作 /25。')],test:k=>{const h=3+k,hosts=2**h-1;return q(`普通广播子网要支持 ${hosts} 台主机。为节约地址，前缀最长可用多少位？`,'位',31-h,`${hosts}+2 超过 2 的 ${h} 次幂，主机位取 ${h+1}，前缀为 ${31-h}。`)}},\n41:{name:'TCP 累计确认',plain:'把数据看成按字节编号的一排信件。确认号写的是“我接下来还缺哪一封”，不是最后收到哪一封。',rule:'按序、无缺口时，ACK = 首字节序号 + 数据字节数。此处无 SYN、FIN，不考虑回绕。',edge:'后面的段先到了，不会填平前面的缺口；只看累计确认号，不把选择确认算进去。',\n pre:q('接收方按序收到字节 100 至 199（含两端），下一个期望序号是多少？','',200,'下一个缺少的字节是 200。',{199:'把最后收到与下一个期望混淆了。'}),steps:[q('数据起始序号 500，长度 40 B，最后一个字节序号是多少？','',539,'500 + 40 − 1 = 539。'),q('接收方原本期望 500，完整收到上述数据，累计确认号是多少？','',540,'最后一个字节号加 1，得到 540。')],test:k=>q(`原本期望 ${k*1000}，随后收到从该序号起连续的 80 B；再收到起始序号 ${k*1000+120} 的 30 B，中间仍缺数据。累计确认号是多少？`,'',k*1000+80,`首个缺失字节是 ${k*1000+80}。后来的乱序段不能推进累计确认。`)},\n51:{name:'HTTP 文档耗时',plain:'一次往返像寄出一封信并等到回信。新建连接和发请求分别要等，收到第一个字节后还需传完正文。',rule:'题设为新建 TCP、明文 HTTP、单文档，无 DNS、排队与处理耗时：T = 2 RTT + L/R。',edge:'如果 TCP 已经建好，省去建连的 RTT，但不能省去请求与响应的往返。',\n pre:q('上述简化模型中，从新建 TCP 到收到单个极小文档，需几个 RTT？','个',2,'建连 1 RTT，请求至响应首字节 1 RTT。',{1:'遗漏了建连或请求响应中的一次往返。'}),steps:[q('文档 10000 B，在 1 Mbit/s 链路上发完需多久？','ms',80,'10000 × 8 ÷ 10⁶ × 1000 = 80 ms。'),q('新建 TCP，RTT 为 30 ms，正文发送需 80 ms，总计多久？','ms',140,'2 × 30 + 80 = 140 ms。')],test:k=>q(`已建立一条空闲 TCP 连接，通过明文 HTTP 获取一个文档。RTT 为 ${k*10} ms，正文发送需 16 ms。忽略其他耗时，总计多久？`,'ms',10*k+16,`已建连，故只加一个 RTT：${10*k} + 16 = ${10*k+16} ms。`)}};\nconst storeKey='net_exam_coach_1'; let history={};\ntry{const data=JSON.parse(studyStore.getItem(storeKey));if(data&&typeof data==='object'&&!Array.isArray(data))history=data;}catch{ $('storageNote').textContent='无法读取旧记录；本轮仍可练习。'; }\nconst persist=()=>{try{studyStore.setItem(storeKey,JSON.stringify(history));}catch{$('storageNote').textContent='此浏览器不允许保存记录，关闭后本轮进度会丢失。';}};\nconst ids=Object.keys(tracks).map(Number),day=86400000;\nlet id=2,phase='pre',index=0,cur,guide,guideIndex,guideLines=[],serial=false;\nconst rec=()=>history[id]??={wins:0,miss:0,streak:0,due:0,last:0,seed:0};\nconst btn=(act,label,primary=false)=>`\u003cbutton type=\"button\" data-do=\"${act}\" class=\"${primary?'pri':''}\">${label}\u003c/button>`;\nconst title=()=>`\u003ch2>${tracks[id].name}\u003c/h2>`;\nconst todayDue=r=>r?.due&&r.due\u003c=Date.now();\nconst priority=i=>{const r=history[i];return todayDue(r)?0:r?.miss&&!r.streak?1:!r?.wins?2:3;};\nconst order=()=>[...ids].sort((a,b)=>priority(a)-priority(b)||(history[a]?.due||0)-(history[b]?.due||0));\nfunction simulate(){return `\u003cdetails>\u003csummary>观察：只改变网卡速率\u003c/summary>\u003clabel>发送速率 \u003cinput type=\"range\" min=\"10\" max=\"200\" step=\"10\" value=\"100\" id=\"speed\">\u003c/label>\u003coutput id=\"reading\">\u003c/output>\u003cdiv class=\"meter\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003csmall>1500 B，单向传播固定 10 ms。绿：发送；蓝：传播。\u003c/small>\u003c/details>`;}\nfunction meter(){const s=$('speed');if(!s)return;const t=12/Number(s.value);$('reading').textContent=`${s.value} Mbit/s：发送 ${+t.toFixed(3)} ms，传播 10 ms`;const bars=stage.querySelector('.meter').children;bars[0].style.width=100*t/(10+t)+'%';bars[1].style.width=1000/(10+t)+'%';}\nstage.addEventListener('input',e=>{if(e.target.id==='speed')meter();});\nfunction explain(){const t=tracks[id];return `\u003cdiv class=\"lesson\">\u003cstrong>先理解\u003c/strong>\u003cp>${t.plain}\u003c/p>\u003cdetails open>\u003csummary>考试公式\u003c/summary>${t.rule}\u003c/details>\u003cdetails>\u003csummary>条件与反例\u003c/summary>${t.edge}\u003c/details>${id===2?simulate():''}\u003c/div>`;}\nfunction ask(kind){phase=kind;const t=tracks[id];if(kind==='test'){const r=rec();r.seed=(r.seed%7)+1;persist();cur=t.test(r.seed);}else cur=kind==='pre'?t.pre:t.steps[index];\n serial=false;stage.innerHTML=title()+`\u003csmall>${kind==='pre'?'01　起点诊断':kind==='step'?`02　基础练习 · ${index+1}/${t.steps.length}`:'03　闭卷变式 · 独立作答'}\u003c/small>\u003cp class=\"qtext\">${cur.text}\u003c/p>\u003cform id=\"answerForm\" class=\"controls\">\u003clabel>答案 \u003cinput id=\"answer\" type=\"text\" inputmode=\"decimal\" autocomplete=\"off\" size=\"12\"> ${cur.unit}\u003c/label>\u003cbutton class=\"pri\">提交\u003c/button>${btn('unknown','不会，先讲这一步')}\u003c/form>\u003cdiv id=\"result\">\u003c/div>`;}\nfunction grade(passUnknown=false){if(serial)return;const val=$('answer').value.trim().normalize('NFKC');if(!passUnknown&&(!/^[+-]?(?:\\d+(?:\\.\\d*)?|\\.\\d+)(?:e[+-]?\\d+)?$/i.test(val)||!Number.isFinite(Number(val)))){$('result').textContent='请输入一个数值，单位已在框旁标明。';return;}\n serial=true;const ok=!passUnknown&&Math.abs(Number(val)-cur.value)\u003c1e-8,r=rec();const message=passUnknown?'这一问暂时不会。':ok?'正确。':(cur.wrong[Number(val)]||'数值不符。请把你的算式与下面这一步对照。');\n r.last=Date.now();if(!ok){r.miss++;r.streak=0;r.due=r.last;r.error=cur.text;r.errors=[{text:cur.text,given:passUnknown?'不会':val,reason:message,work:cur.work},...(r.errors||[])].slice(0,12);}\n if(ok&&phase==='test'){r.wins++;r.streak++;r.due=r.last+day*[1,3,7][Math.min(r.streak-1,2)];}\n persist();$('answerForm').hidden=true;$('answerForm').style.display='none';let html=`\u003cdiv class=\"feedback\">\u003cb>${message}\u003c/b>\u003cp>卷面写法：${cur.work}\u003c/p>\u003c/div>`;\n if(ok&&phase==='test'){html+=`\u003cp>本次变式独立答对。下次复习：${new Date(r.due).toLocaleDateString('zh-CN')}。\u003c/p>${btn('plan','查看下一项',true)}`;}\n else if(!ok){html+=explain()+btn(phase==='step'?'redo':'basics',phase==='step'?'遮住讲解，重做这一步':'从基础步骤练起',true);}\n else if(phase==='pre'){html+=btn('test','直接挑战变式',true)+' '+btn('basics','先做分步练习');}\n else{html+=btn(index+1\u003ctracks[id].steps.length?'next':'test',index+1\u003ctracks[id].steps.length?'下一步':'换题独立检验',true);}\n $('result').innerHTML=html;meter();}\nfunction plan(){const items=order();stage.innerHTML=`\u003ch2>我的复习计划\u003c/h2>\u003cp>独立答对过变式：${ids.filter(i=>history[i]?.wins).length} / ${ids.length} 项　·　到期：${ids.filter(i=>todayDue(history[i])).length} 项\u003c/p>`+items.map(i=>{const r=history[i],state=!r?.last?'未诊断':todayDue(r)?'待复习':r.streak?`复习日 ${new Date(r.due).toLocaleDateString('zh-CN')}`:'待独立检验';return `\u003cdiv class=\"controls\">\u003cbutton data-route=\"${i}\">${tracks[i].name}\u003c/button>\u003cspan>${state}\u003c/span>${r?.error?`\u003csmall>最近卡点：${esc(r.error)}\u003c/small>`:''}\u003c/div>`;}).join('')+`\u003cp class=\"muted\">优先复习到期和答错的专项。连续独立答对后，依次间隔 1、3、7 天复测。记录仅存于当前浏览器。\u003c/p>`;}\nfunction route(i,auto=false){id=i;$('track').value=i;index=0;ask(auto&&history[i]?.wins?'test':'pre');}\nfunction startGuide(n){panel('learn');guide=bank.get(n);guideIndex=0;guideLines=[];guideStep();$('desk').scrollIntoView();}\nfunction guideStep(){const d=guide;const prompts=['审题：已知哪些量，要求的输出是什么？','列式或写规则：哪个条件决定用这种方法？',...d.sol.map((_,i)=>`卷面第 ${i+1} 步：${i===0?'先写第一行计算或判断。':'根据上一行，写出下一步计算、判断或结论。'}`)];\n if(guideIndex===prompts.length){stage.innerHTML=`\u003csmall>原题自查完成 · 不计入独立测验\u003c/small>\u003ch2>${fmt(d.t)}\u003c/h2>\u003ch3>我的解题记录\u003c/h3>\u003col>${guideLines.map(l=>`\u003cli>${esc(l||'未填写')}\u003c/li>`).join('')}\u003c/ol>\u003ch3>参考卷面步骤\u003c/h3>\u003col>${d.sol.map(s=>`\u003cli>${fmt(s)}\u003c/li>`).join('')}\u003c/ol>\u003cp class=\"ans\">${fmt(d.ans)}\u003c/p>\u003cp>${fmt(d.trap)}\u003c/p>${btn('again','重新练习')} \u003cbutton data-route=\"${ids.find(i=>bank.get(i).ch===d.ch)}\">本章诊断专项\u003c/button>`;return;}\n stage.innerHTML=`\u003csmall>原题 ${pad(d.n)}　/　分步自查 ${guideIndex+1} / ${prompts.length}\u003c/small>\u003ch2>${fmt(d.t)}\u003c/h2>\u003cp>${fmt(d.ex)}\u003c/p>${guideIndex>2?`\u003cp class=\"muted\">上一行参考：${fmt(d.sol[guideIndex-3])}\u003c/p>`:''}\u003clabel>\u003cb>${prompts[guideIndex]}\u003c/b>\u003ctextarea id=\"draft\" rows=\"2\">\u003c/textarea>\u003c/label>\u003cdiv class=\"controls\">${btn('compare','对照本步',true)}${btn('teach','不会，讲这一步')}\u003c/div>\u003cdiv id=\"comparison\">\u003c/div>`;}\nfunction compare(skip){const text=$('draft').value.trim();if(!text&&!skip){$('comparison').textContent='先写下你的判断，或选择「不会，讲这一步」。';return;}guideLines[guideIndex]=text;const d=guide,ref=guideIndex===0?d.when:guideIndex===1?d.f.join('；'):d.sol[guideIndex-2];$('comparison').innerHTML=`\u003cdiv class=\"lesson\">\u003cb>${guideIndex===0?'题型线索':guideIndex===1?'公式与规则':'本步参考'}\u003c/b>\u003cp>${fmt(ref)}\u003c/p>\u003c/div>${btn('advance','已核对，下一步',true)}`;}\nstage.addEventListener('submit',e=>{if(e.target.id==='answerForm'){e.preventDefault();grade();}});\nstage.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route){route(+b.dataset.route,true);return;}switch(b.dataset.do){case 'unknown':grade(true);break;case 'plan':plan();break;case 'redo':ask('step');break;case 'basics':index=0;ask('step');break;case 'next':index++;ask('step');break;case 'test':ask('test');break;case 'compare':compare(false);break;case 'teach':compare(true);break;case 'advance':guideLines[guideIndex]=$('draft').value.trim();guideIndex++;guideStep();break;case 'again':startGuide(guide.n);break;}});\n$('content').addEventListener('click',e=>{const b=e.target.closest('[data-practice]');if(b)startGuide(+b.dataset.practice);});\n$('track').innerHTML=ids.map(i=>`\u003coption value=\"${i}\">第 ${bank.get(i).ch} 章 · ${tracks[i].name}\u003c/option>`).join('');$('track').onchange=()=>route(+$('track').value);$('start').onclick=()=>route(+$('track').value);$('plan').onclick=plan;\nconst modules={\n learn:['知识讲解','逐步讲解知识点','#193f73','#a3d6ff','M12 6c-3-2-6-2-10-1v14c4-1 7-1 10 1m0-14c3-2 6-2 10-1v7M12 6v14m4-3 2 2 4-5'],\n qa:['智能问答','引导思考与提问','#155e52','#a2f2ce','M12 18V5a3 3 0 0 0-6-1 4 4 0 0 0-3 6 4 4 0 0 0 0 6 4 4 0 0 0 9 2Zm-6-8 2 1m5-2h5l2-3m-7 8h8m-8 4h4l3 3'],\n drill:['随堂练习','生成闭卷变式题','#543b80','#e0c9ff','M8 5H5v16h14V5h-3M9 3h6v4H9z M8 14l3 3 5-6'],\n errors:['错题分析','分析薄弱知识点','#79501d','#ffe2a2','M3 20v-4m5 4v-7m5 7v-5m5 5V9M3 12l6-6 4 3 8-7'],\n graph:['知识图谱','查看知识关联','#1c5179','#b3eaff','M9 2h6v5H9z M12 7v4M5 16v-5h14v5M2 16h6v5H2z M16 16h6v5h-6z'],\n report:['学习报告','查看学习进度','#65427a','#ead1ff','M2 8 s。\",\"group\":\"第六章 · 往返等待\"},{\"id\":\"6-f-4\",\"ch\":6,\"type\":\"填空\",\"no\":\"4\",\"tag\":\"\",\"stem\":\"无缓存、新建 TCP、明文 HTTP 请求一个极小文档。仅计两次往返，RTT 为 28 ms，总等待为多少毫秒？（填写数值）______。\",\"a\":\"56\",\"why\":\"列出建立连接和请求响应；合计两个 RTT。 结果：56 ms。\",\"group\":\"第六章 · 往返等待\"},{\"id\":\"6-w-A1\",\"ch\":6,\"type\":\"大题\",\"no\":\"A1\",\"tag\":\"\",\"stem\":\"无缓存、新建 TCP、明文 HTTP 请求一个极小文档。仅计两次往返，RTT 为 35 ms，总等待为多少毫秒？ 写出步骤并说明一个适用条件。\",\"a\":\"列出建立连接和请求响应；合计两个 RTT。 70 ms。\",\"why\":\"该模型不含 DNS、TLS、处理和正文传输时间。\",\"group\":\"第六章 · 往返等待\"}];\n","course-docs.js":"globalThis.courseDocs=[{\"file\":\"第一章_填空题与大题完整解析.md\",\"src\":\"# 第一章 · 串行发送\\n\\n发送耗时等于比特数除以链路比特率。\\n\\n### 填空 1\\n125 B 经过 1 Mbit/s 发送器需要多少毫秒？（填写数值）______。\\n\\n**答案：** 1\\n\\n**解析：** 先把字节数乘 8；再除以比特率。 结果：1 ms。\\n\\n### 填空 2\\n250 B 经过 1 Mbit/s 发送器需要多少毫秒？（填写数值）______。\\n\\n**答案：** 2\\n\\n**解析：** 先把字节数乘 8；再除以比特率。 结果：2 ms。\\n\\n### 填空 3\\n375 B 经过 1 Mbit/s 发送器需要多少毫秒？（填写数值）______。\\n\\n**答案：** 3\\n\\n**解析：** 先把字节数乘 8；再除以比特率。 结果：3 ms。\\n\\n### 填空 4\\n500 B 经过 1 Mbit/s 发送器需要多少毫秒？（填写数值）______。\\n\\n**答案：** 4\\n\\n**解析：** 先把字节数乘 8；再除以比特率。 结果：4 ms。\\n\\n### 大题 A1\\n625 B 经过 1 Mbit/s 发送器需要多少毫秒？ 写出步骤并说明一个适用条件。\\n\\n**参考答案：** 先把字节数乘 8；再除以比特率。 5 ms。\\n\\n**解析：** 不要把发送时延和链路传播时间混在一起。\\n\"},{\"file\":\"第二章_填空题与大题完整解析.md\",\"src\":\"# 第二章 · 多级信号\\n\\n理想无噪声模型下，每个有 M 种状态的码元可表示 log₂(M) bit。\\n\\n### 填空 1\\n每秒发送 125 个四状态码元，可表示多少 bit/s？（填写数值）______。\\n\\n**答案：** 250\\n\\n**解析：** 先求每码元信息量；再乘每秒码元数。 结果：250 bit/s。\\n\\n### 填空 2\\n每秒发送 250 个四状态码元，可表示多少 bit/s？（填写数值）______。\\n\\n**答案：** 500\\n\\n**解析：** 先求每码元信息量；再乘每秒码元数。 结果：500 bit/s。\\n\\n### 填空 3\\n每秒发送 375 个四状态码元，可表示多少 bit/s？（填写数值）______。\\n\\n**答案：** 750\\n\\n**解析：** 先求每码元信息量；再乘每秒码元数。 结果：750 bit/s。\\n\\n### 填空 4\\n每秒发送 500 个四状态码元，可表示多少 bit/s？（填写数值）______。\\n\\n**答案：** 1000\\n\\n**解析：** 先求每码元信息量；再乘每秒码元数。 结果：1000 bit/s。\\n\\n### 大题 A1\\n每秒发送 625 个四状态码元，可表示多少 bit/s？ 写出步骤并说明一个适用条件。\\n\\n**参考答案：** 先求每码元信息量；再乘每秒码元数。 1250 bit/s。\\n\\n**解析：** 码元每秒不总等于比特每秒。\\n\"},{\"file\":\"第三章_填空题与大题完整解析.md\",\"src\":\"# 第三章 · 比特填充\\n\\n在数据部分连续五个 1 后插入一个 0。\\n\\n### 填空 1\\n若数据正好由 1 组 111110 拼成，按五个 1 后插 0 的规则会新增多少位？（填写数值）______。\\n\\n**答案：** 1\\n\\n**解析：** 用 0 分隔各段；逐段数原始连续 1 的长度。 结果：1 位。\\n\\n### 填空 2\\n若数据正好由 2 组 111110 拼成，按五个 1 后插 0 的规则会新增多少位？（填写数值）______。\\n\\n**答案：** 2\\n\\n**解析：** 用 0 分隔各段；逐段数原始连续 1 的长度。 结果：2 位。\\n\\n### 填空 3\\n若数据正好由 3 组 111110 拼成，按五个 1 后插 0 的规则会新增多少位？（填写数值）______。\\n\\n**答案：** 3\\n\\n**解析：** 用 0 分隔各段；逐段数原始连续 1 的长度。 结果：3 位。\\n\\n### 填空 4\\n若数据正好由 4 组 111110 拼成，按五个 1 后插 0 的规则会新增多少位？（填写数值）______。\\n\\n**答案：** 4\\n\\n**解析：** 用 0 分隔各段；逐段数原始连续 1 的长度。 结果：4 位。\\n\\n### 大题 A1\\n若数据正好由 5 组 111110 拼成，按五个 1 后插 0 的规则会新增多少位？ 写出步骤并说明一个适用条件。\\n\\n**参考答案：** 用 0 分隔各段；逐段数原始连续 1 的长度。 5 位。\\n\\n**解析：** 插入的 0 不属于原数据。\\n\"},{\"file\":\"第四章_填空题与大题完整解析.md\",\"src\":\"# 第四章 · 子网容量\\n\\n普通 IPv4 广播子网可用地址数为 2 的主机位数次方减二。\\n\\n### 填空 1\\n普通 /28 广播子网可用多少个主机地址？（填写数值）______。\\n\\n**答案：** 14\\n\\n**解析：** 从 32 减去前缀长度；保留网络地址和广播地址。 结果：14 个。\\n\\n### 填空 2\\n普通 /27 广播子网可用多少个主机地址？（填写数值）______。\\n\\n**答案：** 30\\n\\n**解析：** 从 32 减去前缀长度；保留网络地址和广播地址。 结果：30 个。\\n\\n### 填空 3\\n普通 /26 广播子网可用多少个主机地址？（填写数值）______。\\n\\n**答案：** 62\\n\\n**解析：** 从 32 减去前缀长度；保留网络地址和广播地址。 结果：62 个。\\n\\n### 填空 4\\n普通 /25 广播子网可用多少个主机地址？（填写数值）______。\\n\\n**答案：** 126\\n\\n**解析：** 从 32 减去前缀长度；保留网络地址和广播地址。 结果：126 个。\\n\\n### 大题 A1\\n普通 /24 广播子网可用多少个主机地址？ 写出步骤并说明一个适用条件。\\n\\n**参考答案：** 从 32 减去前缀长度；保留网络地址和广播地址。 254 个。\\n\\n**解析：** 此题是传统广播子网，不推广到 /31 或 /32。\\n\"},{\"file\":\"第五章_填空题与大题完整解析.md\",\"src\":\"# 第五章 · 累计确认\\n\\n按序接收时，确认号表示下一期望字节的序号。\\n\\n### 填空 1\\n起始序号 900，按序收到 25 B 数据，不计 SYN 和 FIN。下一确认号是多少？（填写数值）______。\\n\\n**答案：** 925\\n\\n**解析：** 找到首字节序号；加上数据段字节数。 结果：925 。\\n\\n### 填空 2\\n起始序号 900，按序收到 50 B 数据，不计 SYN 和 FIN。下一确认号是多少？（填写数值）______。\\n\\n**答案：** 950\\n\\n**解析：** 找到首字节序号；加上数据段字节数。 结果：950 。\\n\\n### 填空 3\\n起始序号 900，按序收到 75 B 数据，不计 SYN 和 FIN。下一确认号是多少？（填写数值）______。\\n\\n**答案：** 975\\n\\n**解析：** 找到首字节序号；加上数据段字节数。 结果：975 。\\n\\n### 填空 4\\n起始序号 900，按序收到 100 B 数据，不计 SYN 和 FIN。下一确认号是多少？（填写数值）______。\\n\\n**答案：** 1000\\n\\n**解析：** 找到首字节序号；加上数据段字节数。 结果：1000 。\\n\\n### 大题 A1\\n起始序号 900，按序收到 125 B 数据，不计 SYN 和 FIN。下一确认号是多少？ 写出步骤并说明一个适用条件。\\n\\n**参考答案：** 找到首字节序号；加上数据段字节数。 1025。\\n\\n**解析：** 不要把确认号写成最后一个已收到的序号。\\n\"},{\"file\":\"第六章_填空题与大题完整解析.md\",\"src\":\"# 第六章 · 往返等待\\n\\n理想化模型：新建 TCP 获取单个极小文档，忽略其他开销，需要两次往返。\\n\\n### 填空 1\\n无缓存、新建 TCP、明文 HTTP 请求一个极小文档。仅计两次往返，RTT 为 7 ms，总等待为多少毫秒？（填写数值）______。\\n\\n**答案：** 14\\n\\n**解析：** 列出建立连接和请求响应；合计两个 RTT。 结果：14 ms。\\n\\n### 填空 2\\n无缓存、新建 TCP、明文 HTTP 请求一个极小文档。仅计两次往返，RTT 为 14 ms，总等待为多少毫秒？（填写数值）______。\\n\\n**答案：** 28\\n\\n**解析：** 列出建立连接和请求响应；合计两个 RTT。 结果：28 ms。\\n\\n### 填空 3\\n无缓存、新建 TCP、明文 HTTP 请求一个极小文档。仅计两次往返，RTT 为 21 ms，总等待为多少毫秒？（填写数值）______。\\n\\n**答案：** 42\\n\\n**解析：** 列出建立连接和请求响应；合计两个 RTT。 结果：42 ms。\\n\\n### 填空 4\\n无缓存、新建 TCP、明文 HTTP 请求一个极小文档。仅计两次往返，RTT 为 28 ms，总等待为多少毫秒？（填写数值）______。\\n\\n**答案：** 56\\n\\n**解析：** 列出建立连接和请求响应；合计两个 RTT。 结果：56 ms。\\n\\n### 大题 A1\\n无缓存、新建 TCP、明文 HTTP 请求一个极小文档。仅计两次往返，RTT 为 35 ms，总等待为多少毫秒？ 写出步骤并说明一个适用条件。\\n\\n**参考答案：** 列出建立连接和请求响应；合计两个 RTT。 70 ms。\\n\\n**解析：** 该模型不含 DNS、TLS、处理和正文传输时间。\\n\"}];\n","console-ui.js":"(()=>{\n'use strict';\nconst live=window.LICENSE_PAGE, demo=!live,root=document.getElementById('consoleApp'),routes={student:'/license',activate:'/license/activate',admin:'/admin/overview',ledger:'/admin/licenses'},day=86400000;\nconst href=k=>demo?'?page='+k:routes[k],home=demo?'?page=home':'/',now=Date.now(),date=n=>n?new Date(n).toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai'}):'—',e=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst key='study-console-demo-2';let rows=live?.rows||[],v=live?.view||new URLSearchParams(location.search).get('page')||'student',notice='',issued='',search='',filter='',page=1,issuing=false;\nif(demo){try{const s=localStorage.getItem(key);rows=s?JSON.parse(s):null}catch{rows=null}if(!Array.isArray(rows)){rows=Array.from({length:6},(_,i)=>({id:i+1,issued:now-(7-i)*day,start:now-(6-i)*day,end:now+[280,5,24,-1,6,0][i]*day,
